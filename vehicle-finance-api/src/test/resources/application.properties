spring.datasource.url=jdbc:h2:mem:vfs-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
vfs.otp.delivery-mode=development
vfs.otp.expose-development-code=true
vfs.documents.storage=local
vfs.documents.upload-enabled=true
vfs.documents.local-directory=./build/test-quarantine
vfs.documents.multipart-temp-directory=./build/test-multipart-tmp
vfs.documents.max-bytes=5242880
vfs.esign.mode=sandbox
vfs.esign.provider-name=vfs-test-sandbox
vfs.funding.mode=sandbox
vfs.funding.provider-name=vfs-test-funding-sandbox
