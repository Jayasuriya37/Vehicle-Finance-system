server.port=8080
spring.application.name=vehicle-finance-api
spring.jackson.default-property-inclusion=non_null
spring.datasource.url=jdbc:h2:file:./data/vehicle-finance;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.location=${vfs.documents.multipart-temp-directory:./data/multipart-tmp}
vfs.documents.storage=local
vfs.documents.upload-enabled=false
vfs.documents.local-directory=./data/quarantine
vfs.documents.multipart-temp-directory=./data/multipart-tmp
vfs.documents.max-bytes=5242880
vfs.documents.s3-bucket=
vfs.documents.s3-kms-key-id=
vfs.esign.mode=disabled
vfs.esign.provider-name=not-configured
vfs.esign.session-expiry-seconds=900
vfs.esign.signing-base-url=
vfs.esign.webhook-secret=
vfs.funding.mode=disabled
vfs.funding.provider-name=not-configured
vfs.rate-limit.enabled=true
vfs.rate-limit.requests-per-window=60
vfs.rate-limit.window-seconds=60
vfs.otp.delivery-mode=disabled
vfs.otp.expose-development-code=false
vfs.otp.code-length=6
vfs.otp.expiry-seconds=300
vfs.otp.resend-cooldown-seconds=30
vfs.otp.max-attempts=5
