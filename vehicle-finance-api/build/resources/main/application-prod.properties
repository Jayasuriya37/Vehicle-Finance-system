# Activate with SPRING_PROFILES_ACTIVE=prod. Keep database credentials in AWS Secrets Manager
# and inject them as environment variables; never commit production secrets.
spring.datasource.url=${VFS_DATABASE_URL}
spring.datasource.username=${VFS_DATABASE_USERNAME}
spring.datasource.password=${VFS_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
vfs.otp.delivery-mode=disabled
vfs.otp.expose-development-code=false
vfs.otp.max-attempts=5
vfs.otp.expiry-seconds=300
vfs.otp.resend-cooldown-seconds=60
vfs.documents.storage=s3
vfs.documents.s3-bucket=${VFS_DOCUMENTS_BUCKET}
vfs.documents.s3-kms-key-id=${VFS_DOCUMENTS_KMS_KEY_ID}
vfs.esign.mode=${VFS_ESIGN_MODE:disabled}
vfs.esign.provider-name=${VFS_ESIGN_PROVIDER:not-configured}
vfs.esign.signing-base-url=${VFS_ESIGN_SIGNING_BASE_URL:}
vfs.esign.webhook-secret=${VFS_ESIGN_WEBHOOK_SECRET:}
vfs.funding.mode=disabled
vfs.funding.provider-name=not-configured
